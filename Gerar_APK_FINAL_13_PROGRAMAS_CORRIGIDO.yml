name: GERAR APK FINAL - 13 PROGRAMAS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar e extrair a última versão
        shell: bash
        run: |
          set -euo pipefail

          ZIP=""
          if [ -f "WebRadioVemComigoNoGloria_13_PROGRAMAS_OTIMIZADO.zip" ]; then
            ZIP="WebRadioVemComigoNoGloria_13_PROGRAMAS_OTIMIZADO.zip"
          else
            ZIP="$(find . -maxdepth 1 -type f -name '*13_PROGRAMAS*OTIMIZADO*.zip' -print -quit)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERRO: não encontrei o ZIP da versão final com 13 programas."
            echo "Procure no repositório por um arquivo contendo 13_PROGRAMAS e OTIMIZADO no nome."
            exit 1
          fi

          rm -rf projeto-final
          mkdir -p projeto-final
          unzip -q "$ZIP" -d projeto-final

          PROJECT_DIR="$(find projeto-final -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: o ZIP não contém um projeto Android válido."
            exit 1
          fi

          echo "ZIP=$ZIP"
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Validar versão final
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f app/src/main/java/com/vemcomigo/radio/MainActivity.kt
          test -f app/build.gradle.kts

          grep -q "13 PROGRAMAS" app/src/main/java/com/vemcomigo/radio/MainActivity.kt
          grep -q "showPainelLouvores" app/src/main/java/com/vemcomigo/radio/MainActivity.kt

          if find app/src/main/res/raw -mindepth 1 -type d -print -quit | grep -q .; then
            echo "ERRO: existe uma subpasta dentro de res/raw."
            exit 1
          fi

          echo "Projeto final validado."

      - name: Preparar compatibilidade Android
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          for p in Path('.').rglob('*.gradle.kts'):
              s = p.read_text(errors='ignore')
              s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
              p.write_text(s)

          for p in Path('app/src/main').rglob('*.kt'):
              s = p.read_text(errors='ignore')
              s = s.replace(
                  'audioManager.abandonAudioFocus(null, AudioManager.STREAM_MUSIC)',
                  'audioManager.abandonAudioFocus(null)'
              )
              p.write_text(s)
          PY

      - name: Gerar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-APK-FINAL-13-PROGRAMAS
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
