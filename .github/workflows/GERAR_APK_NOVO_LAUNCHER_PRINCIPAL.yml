name: GERAR APK NOVO - LAUNCHER PRINCIPAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar ZIP final
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -iname 'WebRadioVemComigoNoGloria_LAUNCHER_PRINCIPAL_FINAL.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP LAUNCHER PRINCIPAL FINAL NÃO ENCONTRADO."
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          rm -rf build_final
          mkdir build_final
          unzip -q "$ZIP" -d build_final

          SETTINGS=$(find build_final -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Projeto: $ROOT"

      - name: Validar projeto final
        shell: bash
        run: |
          set -e
          test -f "$ROOT/app/build.gradle.kts"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/java/com/vemcomigo/radio/MainActivity.kt"

          grep -q 'LAUNCHER' "$ROOT/app/src/main/AndroidManifest.xml"
          grep -q 'PAINEL DE PLAYLISTS' "$ROOT/app/src/main/java/com/vemcomigo/radio/MainActivity.kt"

          echo "Projeto validado."

      - name: Gerar APK novo
        shell: bash
        run: |
          set -e
          cd "$ROOT"
          gradle clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-APK-LAUNCHER-PRINCIPAL
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
