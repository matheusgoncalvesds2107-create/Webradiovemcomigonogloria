name: Gerar APK - Web Rádio Vem Comigo no Glória Studio REAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      # Não usamos cache: o projeto novo não precisa ter package-lock.json
      # para o setup do Node funcionar.
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Gerar Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin

      - name: Compilar APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
