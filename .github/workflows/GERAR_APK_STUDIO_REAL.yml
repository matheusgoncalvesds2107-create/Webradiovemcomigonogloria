name: Gerar APK - Web Rádio Vem Comigo no Glória Studio REAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Localizar projeto
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(dirname "$(find . -type f -name package.json -not -path '*/node_modules/*' | head -n 1)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ] && [ ! -f "./package.json" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1)"

            if [ -n "$ZIP_FILE" ]; then
              echo "package.json não encontrado. Extraindo: $ZIP_FILE"
              mkdir -p _studio_project
              unzip -q "$ZIP_FILE" -d _studio_project
              PROJECT_DIR="$(dirname "$(find _studio_project -type f -name package.json -not -path '*/node_modules/*' | head -n 1)")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "::error::package.json não foi encontrado no repositório. Coloque os arquivos do projeto Studio REAL no repositório ou envie o ZIP do projeto."
            echo "Arquivos encontrados:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"
          if [ -z "$PROJECT_DIR" ]; then PROJECT_DIR="."; fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Conferir Java
        run: |
          java -version
          javac -version

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências JavaScript
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Gerar Gradle Wrapper
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Compilar APK debug
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -f "${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-Studio-APK
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
