name: Gerar APK - Web Rádio Vem Comigo no Glória Studio REAL

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sem cache do Gradle nesta etapa.
      # Isso evita erro quando o projeto ainda não possui gradle-wrapper.jar.
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Conferir Java
        run: |
          java -version
          javac -version

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependências JavaScript
        run: npm install --no-audit --no-fund

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Gerar Gradle Wrapper
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew

      - name: Compilar APK debug
        working-directory: android
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verificar APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
