name: Gerar APK - Web Rádio Vem Comigo no Glória

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar projeto Android
        shell: bash
        run: |
          set -e
          echo "Procurando settings.gradle.kts..."
          FILE=$(find . -type f -name 'settings.gradle.kts' -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERRO: settings.gradle.kts não encontrado no repositório."
            echo "Verificando arquivos do repositório:"
            find . -maxdepth 5 -type f | sort | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$FILE")"
          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Gerar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
