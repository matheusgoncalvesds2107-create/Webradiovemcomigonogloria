name: Gerar APK Lite - Web Rádio Vem Comigo no Glória

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Procurar e preparar projeto Android
        shell: bash
        run: |
          set -e
          PROJECT_DIR=""

          PROJECT_DIR=$(find . -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -not -path "./.git/*" -print -quit | xargs -r dirname || true)

          if [ -z "$PROJECT_DIR" ]; then
            for ZIP in $(find . -type f -iname "*.zip" -not -path "./.git/*" -print); do
              if unzip -l "$ZIP" | grep -Eq '(^|/)(settings\.gradle\.kts|settings\.gradle)$'; then
                rm -rf _android_project
                mkdir -p _android_project
                unzip -q "$ZIP" -d _android_project
                PROJECT_DIR=$(find _android_project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname || true)
                [ -n "$PROJECT_DIR" ] && break
              fi
            done
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-Lite-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
