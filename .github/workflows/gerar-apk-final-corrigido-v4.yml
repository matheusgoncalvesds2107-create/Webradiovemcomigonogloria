name: Gerar APK Vem Comigo Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Usar o projeto final correto
        shell: bash
        run: |
          set -e
          ZIP="WebRadioVemComigo_APP_Etapa_Final_GitHub.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERRO: o arquivo $ZIP não está na raiz do repositório."
            echo "Arquivos ZIP encontrados:"
            find . -maxdepth 1 -type f -iname '*.zip' -print
            exit 1
          fi

          rm -rf projeto-apk
          mkdir projeto-apk
          unzip -q "$ZIP" -d projeto-apk

          PROJECT_DIR="$(find projeto-apk -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: settings.gradle.kts não encontrado dentro do projeto final."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto selecionado: $PROJECT_DIR"

      - name: Conferir e corrigir compatibilidade
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').rglob('*.gradle.kts'):
              s = p.read_text()
              s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
              s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              p.write_text(s)

          # Garante a assinatura correta do AudioFocus no Android antigo.
          for p in Path('app/src/main').rglob('*.kt'):
              s = p.read_text()
              s = s.replace(
                  'audioManager.abandonAudioFocus(null,AudioManager.STREAM_MUSIC)',
                  'audioManager.abandonAudioFocus(null)'
              )
              s = re.sub(
                  r'audioManager\.abandonAudioFocus\(\s*null\s*,\s*AudioManager\.STREAM_MUSIC\s*\)',
                  'audioManager.abandonAudioFocus(null)',
                  s
              )
              p.write_text(s)
          PY

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigo-APK-Final
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
