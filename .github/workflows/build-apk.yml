name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          rm -rf WebRadioVemComigoAndroid
          unzip -q WebRadioVemComigo_Android_Projeto-1.zip -d WebRadioVemComigoAndroid

      - name: Configurar AndroidX
        working-directory: WebRadioVemComigoAndroid
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir JVM para Java 17
        working-directory: WebRadioVemComigoAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )
          else:
              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              s = s.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )

          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: WebRadioVemComigoAndroid
        run: |
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigo-APK
          path: WebRadioVemComigoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
