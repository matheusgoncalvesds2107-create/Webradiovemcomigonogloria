name: Gerar APK Final

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum arquivo ZIP encontrado na raiz."
            exit 1
          fi

          rm -rf projeto-apk
          mkdir projeto-apk
          unzip -q "$ZIP" -d projeto-apk

          PROJECT_DIR="$(find projeto-apk -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: não encontrei settings.gradle.kts no ZIP."
            find projeto-apk -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Corrigir AndroidX e Java 17
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

          python3 - <<'PY'
          from pathlib import Path

          for p in Path(".").rglob("*.gradle.kts"):
              s = p.read_text()
              s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              p.write_text(s)

          for p in Path("app/src/main").rglob("*.kt"):
              s = p.read_text()

              # Corrige o erro de compilação:
              # abandonAudioFocus(AudioFocusRequest) -> abandonAudioFocusRequest(AudioFocusRequest)
              s = s.replace(
                  "audioManager.abandonAudioFocus(focusRequest!!)",
                  "audioManager.abandonAudioFocusRequest(focusRequest!!)"
              )

              p.write_text(s)
          PY

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
