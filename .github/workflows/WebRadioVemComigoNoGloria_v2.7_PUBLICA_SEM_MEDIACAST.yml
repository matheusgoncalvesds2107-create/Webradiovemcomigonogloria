name: Gerar APK v2.7 - PUBLICA SEM MEDIA CAST

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar projeto Android
        id: android
        shell: bash
        run: |
          set -euo pipefail
          echo "Conteúdo recebido no GitHub:"
          find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print

          SETTINGS=$(find "$GITHUB_WORKSPACE" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: nenhum settings.gradle/settings.gradle.kts foi encontrado."
            echo "Estrutura do repositório:"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Raiz Android encontrada: $PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle.kts" -o -f "$PROJECT_DIR/settings.gradle"
          test -d "$PROJECT_DIR/app"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Gerar APK v2.7
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR='${{ steps.android.outputs.project_dir }}'
          echo "Gerando a partir de: $PROJECT_DIR"
          gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadio-v2.7-PUBLICA-SEM-MEDIA-CAST
          path: ${{ steps.android.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
