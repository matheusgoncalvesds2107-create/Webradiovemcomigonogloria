name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto corrigido
        shell: bash
        run: |
          set -e
          ZIP="WebRadioVemComigoNoGloria_PAINEL_AUDIO_ORGANIZADO_CORRIGIDO_FINAL.zip"
          test -f "$ZIP"
          rm -rf projeto-novo
          mkdir -p projeto-novo
          unzip -q "$ZIP" -d projeto-novo
          PROJECT_DIR="$(find projeto-novo -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          touch gradle.properties
          grep -qF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-APK-PAINEL-AUDIO
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
