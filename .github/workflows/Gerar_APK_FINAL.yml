name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar e preparar projeto
        shell: bash
        run: |
          set -euo pipefail

          # Se o projeto já estiver na raiz, usa a raiz.
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          # Caso tenha sido enviado como ZIP, aceita o nome corrigido sem depender
          # de um nome exato criado por um workflow antigo.
          ZIP="$(find . -maxdepth 2 -type f -name 'WebRadioVemComigoNoGloria_PAINEL_AUDIO_ORGANIZADO*.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERRO: não encontrei o projeto nem o ZIP corrigido."
            echo "Arquivos disponíveis:"
            find . -maxdepth 2 -type f | sort | head -100
            exit 1
          fi

          rm -rf projeto-radio
          mkdir -p projeto-radio
          unzip -q "$ZIP" -d projeto-radio

          PROJECT_DIR="$(find projeto-radio -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: o ZIP não contém um projeto Gradle Android válido."
            exit 1
          fi
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar AndroidX
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          touch gradle.properties
          grep -qF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-APK-FINAL
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
