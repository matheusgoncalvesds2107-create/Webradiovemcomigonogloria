name: Gerar APK Vem Comigo

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Encontrar e extrair projeto
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf projeto-apk
          mkdir projeto-apk
          unzip -q "$ZIP" -d projeto-apk
          PROJECT_DIR="$(find projeto-apk -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Corrigir compatibilidade
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.gradle.kts'):
              s=p.read_text()
              s=s.replace('JavaVersion.VERSION_1_8','JavaVersion.VERSION_17')
              s=s.replace('jvmTarget = "1.8"','jvmTarget = "17"')
              p.write_text(s)
          for p in Path('app/src/main').rglob('*.kt'):
              s=p.read_text()
              s=s.replace('audioManager.abandonAudioFocus(null,AudioManager.STREAM_MUSIC)','audioManager.abandonAudioFocus(null)')
              s=re.sub(r'audioManager\.abandonAudioFocus\(\s*null\s*,\s*AudioManager\.STREAM_MUSIC\s*\)','audioManager.abandonAudioFocus(null)',s)
              p.write_text(s)
          PY

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigo-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
