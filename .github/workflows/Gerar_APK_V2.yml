name: Gerar APK V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto V2
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair WebRadioVemComigoNoGloria_V2.zip
        shell: bash
        run: |
          set -e
          ZIP="WebRadioVemComigoNoGloria_V2_GitHub-1.zip"
          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP nao foi encontrado na raiz do repositorio."
            exit 1
          fi
          rm -rf projeto-v2
          mkdir projeto-v2
          unzip -q "$ZIP" -d projeto-v2
          PROJECT_DIR="$(find projeto-v2 -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android V2 nao encontrado dentro do ZIP."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Garantir AndroidX e Java 17
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          touch gradle.properties
          grep -qxF 'android.useAndroidX=true' gradle.properties || echo 'android.useAndroidX=true' >> gradle.properties
          grep -qxF 'android.enableJetifier=true' gradle.properties || echo 'android.enableJetifier=true' >> gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('.').rglob('*.gradle.kts'):
              s = p.read_text()
              s = s.replace('JavaVersion.VERSION_1_8', 'JavaVersion.VERSION_17')
              s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              p.write_text(s)
          for p in Path('app/src/main').rglob('*.kt'):
              s = p.read_text()
              s = s.replace('audioManager.abandonAudioFocus(null,AudioManager.STREAM_MUSIC)', 'audioManager.abandonAudioFocus(null)')
              s = re.sub(r'audioManager\.abandonAudioFocus\(\s*null\s*,\s*AudioManager\.STREAM_MUSIC\s*\)', 'audioManager.abandonAudioFocus(null)', s)
              s = re.sub(r'audioManager\.abandonAudioFocus\(\s*focusRequest!!\s*\)', 'audioManager.abandonAudioFocusRequest(focusRequest!!)', s)
              p.write_text(s)
          PY

      - name: Compilar APK V2
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Publicar APK V2
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigoNoGloria-V2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
