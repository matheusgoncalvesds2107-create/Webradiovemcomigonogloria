name: Gerar APK Final

on:
  workflow_dispatch:
  push:
    branches:
      - principal

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name 'WebRadioVemComigo_APP_Final.zip' -print -quit)
          test -n "$ZIP"
          rm -rf WebRadioVemComigoAndroid
          unzip -q "$ZIP" -d WebRadioVemComigoAndroid

      - name: Corrigir compatibilidade
        working-directory: WebRadioVemComigoAndroid
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/vemcomigo/radio/MainActivity.kt")
          s = p.read_text()
          s = s.replace("    private lateinit var audioManager: AudioManager\n", "")
          s = s.replace("    private var focusRequest: AudioFocusRequest? = null\n", "")
          s = s.replace("        audioManager = getSystemService(AUDIO_SERVICE) as AudioManager\n", "")
          start = s.find("    private fun requestFocus()")
          if start != -1:
              end = s.find("\n    private fun abandonFocus()", start)
              if end != -1:
                  end2 = s.find("\n    override fun onDestroy()", end)
                  s = s[:start] + s[end2:]
          s = s.replace("        requestFocus()\n", "")
          s = s.replace("            abandonFocus()\n", "")
          s = s.replace("        abandonFocus()\n", "")
          s = s.replace("import android.media.*\n", "import android.media.MediaPlayer\n")
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )
          p.write_text(s)
          PY

      - name: Compilar APK
        working-directory: WebRadioVemComigoAndroid
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigo-APK
          path: WebRadioVemComigoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
