name: Gerar APK Final

on:
  workflow_dispatch:
  push:
    branches: [main, principal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          test -f WebRadioVemComigo_APP_Final.zip
          rm -rf WebRadioVemComigoAndroid
          mkdir WebRadioVemComigoAndroid
          unzip -q WebRadioVemComigo_APP_Final.zip -d WebRadioVemComigoAndroid
          echo 'android.useAndroidX=true' >> WebRadioVemComigoAndroid/gradle.properties
          echo 'android.enableJetifier=true' >> WebRadioVemComigoAndroid/gradle.properties

      - name: Gerar APK
        working-directory: WebRadioVemComigoAndroid
        run: gradle assembleDebug --stacktrace

      - name: Entregar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadioVemComigo-APK
          path: WebRadioVemComigoAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
