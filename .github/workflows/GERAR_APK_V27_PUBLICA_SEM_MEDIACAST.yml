name: Gerar APK v2.7 - PUBLICA SEM MEDIA CAST
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Gerar APK v2.7
        run: gradle clean assembleDebug --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WebRadio-v2.7-PUBLICA-SEM-MEDIA-CAST
          path: app/build/outputs/apk/debug/app-debug.apk
